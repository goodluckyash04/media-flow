[project]
name = "audio-downloader"
version = "1.0.0"
description = "Local media downloader and audio converter"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "yt-dlp>=2024.11.18",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "pillow>=10.4.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
spotify = [
    "spotipy>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "coverage>=7.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["config", "downloader"]
