<header class="topbar">
  <!-- Mobile menu toggle -->
  <button class="btn btn-secondary btn-icon d-md-none me-2" id="sidebarToggle" aria-label="Toggle sidebar">
    <i class="bi bi-list"></i>
  </button>

  <div class="topbar-title">{% block topbar_title %}{% endblock %}</div>

  <div class="topbar-actions">
    <!-- Theme toggle -->
    <button class="btn btn-secondary btn-icon btn-sm" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <i class="bi bi-moon-stars" id="themeIcon"></i>
    </button>

    <!-- Quick download button -->
    <a href="{% url 'download' %}" class="btn btn-primary btn-sm" id="topbar-quick-download">
      <i class="bi bi-plus-lg"></i>
      <span class="d-none d-lg-inline">New Download</span>
    </a>
  </div>
</header>
